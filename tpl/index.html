<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>文章校阅展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 0;
            margin: 0;
            line-height: 1.8;
        }

        .container {
            width: 100%;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            text-align: center;
        }

        .input-panel {
            background: white;
            padding: 24px 28px;
            margin-bottom: 30px;
            border-radius: 0;
            box-shadow: none;
            border-bottom: 1px solid #e5e7eb;
        }

        .input-panel-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }

        .input-panel-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 14px;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            border-radius: 6px;
            border: 1px solid #ddd;
            padding: 10px 12px;
            font-size: 14px;
            line-height: 1.8;
            resize: vertical;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        textarea:focus {
            border-color: #409EFF;
            box-shadow: 0 0 0 1px rgba(64, 158, 255, 0.15);
        }

        .actions {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        button {
            background: #409EFF;
            border: none;
            color: #fff;
            border-radius: 4px;
            padding: 8px 18px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }

        button:hover {
            background: #3a8ee6;
            box-shadow: 0 2px 8px rgba(64, 158, 255, 0.3);
        }

        .hint {
            font-size: 12px;
            color: #999;
        }

        .error {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 4px;
            background: #fef0f0;
            color: #f56c6c;
            font-size: 13px;
            border: 1px solid #fde2e2;
        }

        .article-item {
            background: white;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 0;
            box-shadow: none;
            border-bottom: 1px solid #e5e7eb;
        }

        .article-items-container {
            display: flex;
            gap: 24px;
            margin-bottom: 30px;
        }

        .article-items-container .article-item {
            flex: 1;
            margin-bottom: 0;
        }

        .article-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .article-header h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .article-id {
            color: #666;
            font-size: 14px;
        }

        .article-content {
            font-size: 16px;
            color: #333;
            word-wrap: break-word;
        }

        .compare-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
        }

        .highlight {
            background: linear-gradient(120deg, #ffd54f 0%, #ffb74d 100%);
            padding: 2px 4px;
            border-radius: 3px;
            display: inline-block;
        }

        /* 服务二：删除操作 - 红色 */
        .highlight-delete {
            background: linear-gradient(120deg, #ff6b6b 0%, #ee5a6f 100%);
            padding: 2px 4px;
            border-radius: 3px;
            display: inline-block;
        }

        /* 服务二：插入操作 - 绿色 */
        .highlight-insert {
            background: linear-gradient(120deg, #51cf66 0%, #40c057 100%);
            padding: 2px 4px;
            border-radius: 3px;
            display: inline-block;
        }

        /* 服务二：替换操作 - 蓝色 */
        .highlight-replace {
            background: linear-gradient(120deg, #4dabf7 0%, #339af0 100%);
            padding: 2px 4px;
            border-radius: 3px;
            display: inline-block;
        }

        /* 错误列表样式 */
        .error-list {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .error-list-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
        }

        .error-item {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 12px;
            transition: box-shadow 0.2s;
        }

        .error-item:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .error-item-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .error-item-index {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: #409EFF;
            color: white;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 600;
            margin-right: 10px;
        }

        .error-item-text {
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }

        .error-item-type {
            display: inline-block;
            padding: 2px 8px;
            background: #f0f9ff;
            color: #409EFF;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 8px;
        }

        .error-item-details {
            margin-left: 34px;
            font-size: 14px;
            color: #666;
        }

        .error-item-suggestions {
            margin-top: 6px;
        }

        .error-item-suggestions-label {
            color: #999;
            font-size: 13px;
        }

        .error-item-suggestion {
            display: inline-block;
            background: #f0f9ff;
            color: #409EFF;
            padding: 4px 10px;
            border-radius: 4px;
            margin-right: 8px;
            margin-top: 4px;
            font-size: 13px;
        }

        .error-item-message {
            margin-top: 6px;
            color: #666;
            font-size: 13px;
        }

        .error-item-sentence {
            margin-top: 8px;
            padding: 8px 12px;
            background: #f9fafb;
            border-left: 3px solid #409EFF;
            border-radius: 4px;
            font-size: 13px;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 16px;
        }

        .api-response {
            margin-top: 16px;
            background: #f7f7f9;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 12px 14px;
        }

        .api-response-title {
            font-size: 14px;
            color: #444;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .api-response-body {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            padding: 10px 12px;
            font-family: Menlo, Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            word-break: break-all;
        }

        details.api-response-details {
            border-radius: 6px;
            border: 1px solid #e5e7eb;
            background: #f7f7f9;
            padding: 10px 12px;
        }

        details.api-response-details summary {
            cursor: pointer;
            font-size: 14px;
            color: #444;
            font-weight: 600;
            list-style: none;
            outline: none;
        }

        details.api-response-details summary::-webkit-details-marker {
            display: none;
        }

        details.api-response-details summary::before {
            content: "▶";
            display: inline-block;
            margin-right: 6px;
            font-size: 12px;
            transition: transform 0.1s ease;
        }

        details.api-response-details[open] summary::before {
            transform: rotate(90deg);
        }

        /* 加载遮罩层 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(2px);
        }

        .loading-overlay.show {
            display: flex;
        }

        /* 加载动画容器 */
        .loading-content {
            text-align: center;
        }

        /* 旋转的加载圆圈 */
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #409EFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #666;
            font-size: 14px;
        }

        /* 结果区域加载状态 */
        .article-content.loading {
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .article-content .service-loading {
            text-align: center;
            padding: 40px 20px;
        }

        .article-content .service-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #409EFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        .article-content .service-loading-text {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>文章校阅展示</h1>

        <div class="input-panel">
            <div class="input-panel-title">输入待校阅内容</div>
            <div class="input-panel-desc">在下方文本框中输入或粘贴文章内容，点击「开始校阅」后将在下方展示高亮结果。</div>
            <form id="proofreadForm">
                <label>
                    <textarea name="content" id="contentTextarea"
                        placeholder="在这里粘贴或输入需要校阅的文章...">{{ .content }}</textarea>
                </label>
                <div class="actions">
                    <button type="button" id="submitBtn">开始校阅</button>
                    <span class="hint">后端接口地址来自配置文件中的 proofreadApiUrl。</span>
                </div>
            </form>
            {{ if .error }}
            <div class="error">{{ .error }}</div>
            {{ end }}
        </div>

        <div class="article-items-container">
            <div class="article-item">
                <div class="compare-title">大语言模型</div>
                <div class="article-content" id="serviceOneContent">
                    {{ .highlighted }}
                </div>
                <div class="error-list" id="serviceOneErrorList" style="display: none;"></div>
            </div>

            <div class="article-item">
                <div class="compare-title">训练模型</div>
                <div class="article-content" id="serviceTwoContent">
                    {{ .highlighted2 }}
                </div>
                <div class="error-list" id="serviceTwoErrorList" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        // 渲染错误列表（服务一格式）
        function renderErrorListServiceOne(errors, containerId) {
            var container = document.getElementById(containerId);
            if (!container) return;

            if (!errors || errors.length === 0) {
                container.style.display = 'none';
                return;
            }

            var html = '<div class="error-list-title">错误列表（共 ' + errors.length + ' 处）</div>';
            for (var i = 0; i < errors.length; i++) {
                var err = errors[i];
                html += '<div class="error-item">';
                html += '<div class="error-item-header">';
                html += '<span class="error-item-index">' + (i + 1) + '</span>';
                html += '<span class="error-item-text">' + escapeHtml(err.text || '') + '</span>';
                if (err.type) {
                    html += '<span class="error-item-type">' + escapeHtml(err.type) + '</span>';
                }
                html += '</div>';
                html += '<div class="error-item-details">';
                if (err.suggestions && err.suggestions.length > 0) {
                    html += '<div class="error-item-suggestions">';
                    html += '<span class="error-item-suggestions-label">建议：</span>';
                    for (var j = 0; j < err.suggestions.length; j++) {
                        html += '<span class="error-item-suggestion">' + escapeHtml(err.suggestions[j]) + '</span>';
                    }
                    html += '</div>';
                }
                if (err.message) {
                    html += '<div class="error-item-message">原因：' + escapeHtml(err.message) + '</div>';
                }
                if (err.sentence) {
                    html += '<div class="error-item-sentence">' + escapeHtml(err.sentence) + '</div>';
                }
                html += '</div>';
                html += '</div>';
            }
            container.innerHTML = html;
            container.style.display = 'block';
        }

        // 渲染错误列表（服务二格式）
        function renderErrorListServiceTwo(errors, containerId) {
            var container = document.getElementById(containerId);
            if (!container) return;

            if (!errors || errors.length === 0) {
                container.style.display = 'none';
                return;
            }

            var html = '<div class="error-list-title">错误列表（共 ' + errors.length + ' 处）</div>';
            for (var i = 0; i < errors.length; i++) {
                var err = errors[i];
                html += '<div class="error-item">';
                html += '<div class="error-item-header">';
                html += '<span class="error-item-index">' + (i + 1) + '</span>';
                html += '<span class="error-item-text">' + escapeHtml(err.text || '') + '</span>';
                if (err.tag) {
                    html += '<span class="error-item-type">' + escapeHtml(err.tag) + '</span>';
                }
                html += '</div>';
                html += '<div class="error-item-details">';
                if (err.text) {
                    html += '<div class="error-item-message">操作：' + escapeHtml(err.tag || '') + '</div>';
                }
                html += '</div>';
                html += '</div>';
            }
            container.innerHTML = html;
            container.style.display = 'block';
        }

        // HTML转义函数
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 按钮点击改为前端并行调用两个 JSON 接口
        document.getElementById('submitBtn').addEventListener('click', function (e) {
            e.preventDefault();
            var textarea = document.getElementById('contentTextarea');
            var content = textarea.value.trim();

            if (!content) {
                return;
            }

            var submitBtn = document.getElementById('submitBtn');
            var serviceOneContent = document.getElementById('serviceOneContent');
            var serviceTwoContent = document.getElementById('serviceTwoContent');
            var serviceOneErrorList = document.getElementById('serviceOneErrorList');
            var serviceTwoErrorList = document.getElementById('serviceTwoErrorList');

            // 隐藏错误列表
            if (serviceOneErrorList) serviceOneErrorList.style.display = 'none';
            if (serviceTwoErrorList) serviceTwoErrorList.style.display = 'none';

            // 禁用按钮，防止重复点击
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.6';
            submitBtn.style.cursor = 'not-allowed';

            // 显示加载动画
            var loadingHtml = '<div class="service-loading"><div class="service-spinner"></div><div class="service-loading-text">正在校阅中...</div></div>';
            serviceOneContent.innerHTML = loadingHtml;
            serviceOneContent.classList.add('loading');
            serviceTwoContent.innerHTML = loadingHtml;
            serviceTwoContent.classList.add('loading');

            // 跟踪两个服务的完成状态
            var pending = 2;
            function doneOne() {
                pending--;
                if (pending <= 0) {
                    // 两个服务都完成后，重新启用按钮
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    submitBtn.style.cursor = 'pointer';
                }
            }

            // 调用服务一
            fetch('/api/proofread/one', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            }).then(function (res) { return res.json(); })
                .then(function (data) {
                    serviceOneContent.classList.remove('loading');
                    if (data.highlightedHtml !== undefined) {
                        serviceOneContent.innerHTML = data.highlightedHtml;
                    } else {
                        serviceOneContent.innerHTML = '<span class="hint">服务一返回数据格式错误</span>';
                    }
                    if (data.errors && serviceOneErrorList) {
                        renderErrorListServiceOne(data.errors, 'serviceOneErrorList');
                    }
                    if (data.errorCount !== undefined && document.getElementById('errorCount')) {
                        document.getElementById('errorCount').textContent = data.errorCount;
                    }
                    if (data.rawResponse !== undefined && document.getElementById('raw1')) {
                        document.getElementById('raw1').textContent = data.rawResponse;
                    }
                }).catch(function (err) {
                    serviceOneContent.classList.remove('loading');
                    serviceOneContent.innerHTML = '<span class="hint">服务一请求失败</span>';
                    if (serviceOneErrorList) serviceOneErrorList.style.display = 'none';
                }).finally(doneOne);

            // 调用服务二
            fetch('/api/proofread/two', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            }).then(function (res) { return res.json(); })
                .then(function (data) {
                    serviceTwoContent.classList.remove('loading');
                    if (data.highlightedHtml !== undefined) {
                        serviceTwoContent.innerHTML = data.highlightedHtml;
                    } else {
                        serviceTwoContent.innerHTML = '<span class="hint">服务二返回数据格式错误</span>';
                    }
                    if (data.errors && serviceTwoErrorList) {
                        renderErrorListServiceTwo(data.errors, 'serviceTwoErrorList');
                    }
                    if (data.rawResponse !== undefined && document.getElementById('raw2')) {
                        document.getElementById('raw2').textContent = data.rawResponse;
                    }
                }).catch(function (err) {
                    serviceTwoContent.classList.remove('loading');
                    serviceTwoContent.innerHTML = '<span class="hint">服务二请求失败</span>';
                    if (serviceTwoErrorList) serviceTwoErrorList.style.display = 'none';
                }).finally(doneOne);
        });
    </script>
</body>

</html>
